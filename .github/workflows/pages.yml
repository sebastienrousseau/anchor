#
# Builds the website and publishes it to GitHub Pages.
#
# The site is pkg/iso20022 compiled to WebAssembly, so the browser runs the same
# engine as the CLI. It ships no ISO 20022 specification content -- only the
# embedded index of what exists and where the Registration Authority hosts it.

name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true

      # The content half of the site is built by ssg, which is a Rust binary.
      # Installing it from crates.io is a couple of minutes on a cold cache and
      # near-instant on a warm one, which is why the cargo registry is cached.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
          key: cargo-ssg-${{ runner.os }}-0.0.56

      - name: Install ssg
        run: command -v ssg || cargo install ssg --version 0.0.56 --locked

      # The terminal sessions on the site are replayed against the binary
      # before it is published. A reworded diagnostic or a renamed flag should
      # fail the deploy, not quietly leave the site showing output the tool
      # stopped producing months ago.
      - name: Verify the terminal sessions against the binary
        run: make sessions

      - name: Build the site
        run: make web

      # The site is only as trustworthy as the bridge between Go and JavaScript.
      # A renamed API or a field that stops serialising would break the page
      # silently, so the smoke test gates the deploy.
      - name: Smoke-test the bundle
        run: node web/wasm/smoke_test.mjs

      # The premise of the project is that it redistributes no specification
      # content. This is the gate that keeps that true rather than aspirational.
      - name: Verify no specification content is being published
        run: |
          if find web/public -name '*.xsd' -o -name '*.pdf' -o -name '*.docx' | grep -q .; then
            echo "::error::the site must not ship ISO 20022 specification content"
            find web/public -name '*.xsd' -o -name '*.pdf' -o -name '*.docx'
            exit 1
          fi
          echo "site contents:"; ls -lha web/public

      # These are the files that make the site discoverable to an assistant
      # rather than only to a person, and they live under a dot directory that
      # is easy to lose between the build and the deployed artefact. Assert
      # them here so the loss is a build failure rather than a quiet 404.
      - name: Verify agentic discovery files are present
        run: |
          for f in .nojekyll .well-known/mcp.json .well-known/ai-plugin.json mcp.json ai-plugin.json agents.txt; do
            if [ -e "web/public/$f" ]; then
              echo "ok      $f"
            else
              echo "::error::missing $f"; exit 1
            fi
          done

      # 2,845 of the pages are the message definitions, and they are the reason
      # the site is discoverable at all. An empty sitemap published them to
      # nobody, which is exactly the kind of failure that looks like success.
      - name: Verify the sitemap lists every page
        run: |
          pages="$(find web/public -name index.html | wc -l | xargs)"
          locs="$(grep -c '<loc>' web/public/sitemap.xml || echo 0)"
          echo "pages: $pages   sitemap entries: $locs"
          [ "$locs" = "$pages" ] || { echo "::error::sitemap lists $locs of $pages pages"; exit 1; }
          [ "$pages" -gt 2000 ] || { echo "::error::only $pages pages built"; exit 1; }

      # ssg runs an accessibility pass over every page it builds. Failing the
      # deploy on it is what stops the WCAG 2.2 AA claim drifting out of date.
      - name: Enforce the accessibility gate
        run: |
          issues="$(python3 -c 'import json;print(json.load(open("web/public/accessibility-report.json"))["total_issues"])')"
          echo "WCAG 2.2 issues: $issues"
          [ "$issues" = "0" ] || { echo "::error::accessibility gate failed"; exit 1; }

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
