{{#extends "base"}}
{{#block "main"}}
<section class="page-banner" aria-labelledby="deadline-heading">
  {{#if banner}}
  <img class="page-banner-image"
       src="{{site_path}}images/banners/{{banner}}-1280.webp"
       srcset="{{site_path}}images/banners/{{banner}}-640.webp 640w,
               {{site_path}}images/banners/{{banner}}-1280.webp 1280w"
       sizes="100vw"
       width="1280" height="340"
       alt="{{banner_alt}}"
       fetchpriority="high" decoding="async" />
  {{/if}}
  <div class="page-banner-body">
    <div class="container stack">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1 id="deadline-heading">{{headline}}</h1>
      <p class="lead">{{lead}}</p>
    </div>
  </div>
</section>

<!-- The countdown, directly beneath the masthead rather than inside it. In the
     banner it made this one page taller than every other, which is exactly the
     inconsistency a set of mastheads exists to avoid. Out here it also gets to
     be the first thing on the page rather than a card in a corner of a photo. -->
<section class="section countdown-band" aria-label="Time remaining">
  <div class="container">
    <!-- The number is filled in by deadline.js. The markup ships the date
         itself, not a count computed at build time: a page that says "89 days"
         is wrong the morning after it is published, and a wrong countdown is
         worse than none on a page whose whole subject is a date.

         Both lines are short enough to set on one line at 360px, because that
         is what the script replaces them with. The sentence that used to stand
         here wrapped to two lines on a phone and the script then collapsed it
         to one, dropping everything below by 76px — and it only repeated the
         headline immediately above, so nothing was lost in shortening it. -->
    <div class="countdown" role="status">
      <p class="countdown-value"><span id="days-remaining">14 Nov 2026</span></p>
      <p class="countdown-label"><span id="days-label">the CBPR+ deadline</span></p>
    </div>
  </div>
</section>

<section class="section" aria-labelledby="deadline-body">
  <div class="container prose">
    <h2 id="deadline-body" class="visually-hidden">The November 2026 mandate</h2>
    {{!content}}
  </div>
</section>

<script src="{{site_path}}deadline.js" defer></script>
{{/block}}
