<!DOCTYPE html>
<!-- `no-js` is removed by theme-init.js. Until then, and forever if
     scripting is unavailable, the stylesheet uses it to keep every
     JavaScript-dependent affordance in a usable state. -->
<html lang="{{language}}" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>{{title}}</title>

    <!-- Strict same-origin policy; see README "Security". `form_origin`
         must name your form endpoint or the browser blocks the POST.
         'wasm-unsafe-eval' is what lets WebAssembly.instantiateStreaming run
         the playground bundle. It permits WASM compilation only — it does not
         re-enable eval() for JavaScript, which is why it exists as a separate
         keyword. Without it the engine fails to load with a CompileError and
         the page silently becomes a static shell. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'none';
               object-src 'none';
               script-src 'self' 'wasm-unsafe-eval';
               style-src 'self';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self';
               manifest-src 'self';
               form-action 'self' {{form_origin}}"
    />


    {{!primary}}
    {{!opengraph}}
    {{!twitter}}
    {{!apple}}
    {{!microsoft}}

    <!-- Absolute URLs: Open Graph consumers do not resolve relative paths. -->
    <meta property="og:image" content="{{site_url}}images/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{title}}" />
    <meta name="twitter:image" content="{{site_url}}images/social-card.png" />

    <link rel="canonical" href="{{permalink}}" />
    <link rel="alternate" hreflang="{{language}}" href="{{permalink}}" />
    <link rel="alternate" hreflang="x-default" href="{{permalink}}" />

    <link rel="alternate" type="application/rss+xml" title="{{name}} — RSS" href="{{site_path}}rss.xml" />
    <link rel="alternate" type="application/atom+xml" title="{{name}} — Atom" href="{{site_path}}atom.xml" />
    <link rel="alternate" type="application/feed+json" title="{{name}} — JSON Feed" href="{{site_path}}feed.json" />
    <link rel="manifest" href="{{site_path}}manifest.json" />
    <link rel="icon" href="{{site_path}}favicon.ico" sizes="any" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1014" media="(prefers-color-scheme: dark)" />

    <!-- Native cross-document View Transitions. Browsers without support
         ignore the hint and perform an ordinary navigation. -->
    <meta name="view-transition" content="same-origin" />

    <!-- Authored structured data; see README "Structured data". -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "{{site_url}}#website",
            "url": "{{site_url}}",
            "name": "{{name}}",
            "description": "{{description}}",
            "inLanguage": "{{language}}"
          },
          {
            "@type": "Organization",
            "@id": "{{site_url}}#organization",
            "name": "AskISO",
            "url": "{{site_url}}",
            "logo": "{{site_url}}images/social-card.png",
            "description": "Open-source ISO 20022 tooling: validation, linting, scheme rule checks and SWIFT MT conversion.",
            "sameAs": ["https://github.com/sebastienrousseau/askiso"]
          },
          {
            "@type": "WebPage",
            "@id": "{{permalink}}#webpage",
            "url": "{{permalink}}",
            "name": "{{title}}",
            "description": "{{description}}",
            "inLanguage": "{{language}}",
            "isPartOf": { "@id": "{{site_url}}#website" },
            "publisher": { "@id": "{{site_url}}#organization" },
            "datePublished": "{{date}}"
          }
        ]
      }
    </script>

    <link rel="stylesheet" href="{{site_path}}styles.css" />
    <!-- Brand layer: overrides the theme tokens and adds the components
         the theme has no opinion about. Order matters. -->
    <link rel="stylesheet" href="{{site_path}}brand.css" />
    <!-- Only the playground needs the app styles, and they are the largest
         stylesheet on the site. Loading them on all 2,848 pages would be a
         page-weight regression for the 2,847 that never use them. -->
    {{#if nav_playground}}<link rel="stylesheet" href="{{site_path}}playground.css" />{{/if}}
    {{#if nav_workspace}}<link rel="stylesheet" href="{{site_path}}workspace.css" />{{/if}}
    <script src="{{site_path}}theme-init.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    {{> header}}

    <main id="main">
      {{#block "main"}}{{/block}}
    </main>

    {{> footer}}

    <script src="{{site_path}}main.js" defer></script>
    <!-- Wraps shell blocks in terminal chrome and types them out. Purely
         additive: the commands are in the HTML with or without it. -->
    <script src="{{site_path}}terminal.js" defer></script>
  </body>
</html>
